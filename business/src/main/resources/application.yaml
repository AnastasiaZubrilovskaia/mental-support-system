server:
  port: 8082

spring:
  application:
    name: business
  config:
    import: optional:file:.env[.properties]
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_APP_DB}
    username: ${MONGO_APP_USER}
    password: ${MONGO_APP_PASSWORD}
    authentication-database: ${MONGO_APP_DB}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}