server:
  port: 8081

spring:
  application:
    name: auth
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_mental_support}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    issuer: psych-support-auth
    access-ttl: 15m
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./secrets/jwt_private.pem}
  session:
    refresh-ttl: 30d
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: Strict
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}